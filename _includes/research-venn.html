<style>
.rv-section { margin: 40px 0 0; }
.rv-wrapper { position: relative; width: 100%; max-width: 920px; margin: 0 auto; }
.rv-svg { width: 100%; height: auto; display: block; overflow: visible; }

/*
  Blob scaling is handled by writing SVG transform attributes directly.
  This keeps the soft overlapping blend effect intact during hover.
*/

.zone-rq {
  opacity: 0;
  transition: opacity 0.28s ease 0.06s;
  pointer-events: none;
  fill: #1d1d1d;
  font-family: "Segoe Print", "Bradley Hand", cursive;
  font-size: 11.5px;
}
[data-hover="a"] .zone-rq-a { opacity: 1; }
[data-hover="b"] .zone-rq-b { opacity: 1; }
[data-hover="c"] .zone-rq-c { opacity: 1; }
[data-hover="d"] .zone-rq-d { opacity: 1; }

.rv-label {
  fill: #20242a;
  transition: opacity 0.28s ease;
}
.rv-label-line {
  fill: none;
  stroke: #e05a2b;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-opacity: 0.62;
  transition: opacity 0.28s ease, stroke-opacity 0.28s ease, stroke-width 0.28s ease;
}
[data-hover="a"] .rv-label:not(.rv-label-a),
[data-hover="b"] .rv-label:not(.rv-label-b),
[data-hover="c"] .rv-label:not(.rv-label-c),
[data-hover="d"] .rv-label:not(.rv-label-d) { opacity: 0.22; }
[data-hover="a"] .rv-label-line:not(.rv-label-line-a),
[data-hover="b"] .rv-label-line:not(.rv-label-line-b),
[data-hover="c"] .rv-label-line:not(.rv-label-line-c),
[data-hover="d"] .rv-label-line:not(.rv-label-line-d) { opacity: 0.12; }
[data-hover="a"] .rv-label-line-a,
[data-hover="b"] .rv-label-line-b,
[data-hover="c"] .rv-label-line-c,
[data-hover="d"] .rv-label-line-d { stroke-opacity: 0.92; stroke-width: 2.4; }

.rv-wing {
  stroke: rgba(24,24,24,0.22);
  stroke-width: 1;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: fill-opacity 0.26s ease, stroke 0.26s ease, stroke-width 0.26s ease, opacity 0.26s ease;
}
.rv-wing-a { fill: #7b9cc8; fill-opacity: 0.13; }
.rv-wing-b { fill: #c8868e; fill-opacity: 0.12; }
.rv-wing-c { fill: #82b896; fill-opacity: 0.13; }
.rv-wing-d { fill: #d1a760; fill-opacity: 0.14; }
[data-hover] .rv-wing { fill-opacity: 0.045; stroke-opacity: 0.2; }
[data-hover="a"] .rv-wing-a,
[data-hover="b"] .rv-wing-b,
[data-hover="c"] .rv-wing-c,
[data-hover="d"] .rv-wing-d {
  fill-opacity: 0.23;
  stroke: #1d1d1d;
  stroke-opacity: 0.88;
  stroke-width: 1.65;
}
.rv-wing-sketch {
  fill: none;
  stroke: #1d1d1d;
  stroke-width: 0.7;
  stroke-opacity: 0.14;
  stroke-linecap: round;
  stroke-linejoin: round;
  transform: translate(0.7px, -0.45px);
  transition: stroke-opacity 0.26s ease, stroke-width 0.26s ease, transform 0.26s ease;
}
[data-hover] .rv-wing-sketch { stroke-opacity: 0.06; }
[data-hover="a"] .rv-wing-sketch-a,
[data-hover="b"] .rv-wing-sketch-b,
[data-hover="c"] .rv-wing-sketch-c,
[data-hover="d"] .rv-wing-sketch-d {
  stroke-opacity: 0.62;
  stroke-width: 1.05;
  transform: translate(1.25px, -0.8px);
}

/* ── Subtle butterfly wing motion ── */
.rv-flap {
  transform-box: view-box;
  will-change: transform;
}
.rv-flap-a { transform-origin: 438px 325px; }
.rv-flap-b { transform-origin: 462px 325px; }
.rv-flap-c { transform-origin: 437px 346px; }
.rv-flap-d { transform-origin: 463px 346px; }
@keyframes rv-flap-left {
  0%, 100% { transform: scaleX(1) rotate(0deg); }
  46% { transform: scaleX(0.985) rotate(0.55deg); }
  56% { transform: scaleX(0.965) rotate(1.25deg); }
  70% { transform: scaleX(0.993) rotate(0.18deg); }
}
@keyframes rv-flap-right {
  0%, 100% { transform: scaleX(1) rotate(0deg); }
  46% { transform: scaleX(0.985) rotate(-0.55deg); }
  56% { transform: scaleX(0.965) rotate(-1.25deg); }
  70% { transform: scaleX(0.993) rotate(-0.18deg); }
}
@media (prefers-reduced-motion: no-preference) {
  .rv-flap-a,
  .rv-flap-c { animation: rv-flap-left 3.8s ease-in-out infinite; }
  .rv-flap-b,
  .rv-flap-d { animation: rv-flap-right 3.8s ease-in-out infinite; }
  .rv-flap-c,
  .rv-flap-d { animation-delay: 0.08s; }
  [data-hover="a"] .rv-flap-a,
  [data-hover="b"] .rv-flap-b,
  [data-hover="c"] .rv-flap-c,
  [data-hover="d"] .rv-flap-d { animation-duration: 2.15s; }
}

/* ── Connector flow ── */
.rv-connector {
  stroke: #e05a2b;
  stroke-opacity: 0.08;
  stroke-width: 1.4;
  stroke-dasharray: 5 10;
  stroke-linecap: round;
  transition: stroke-opacity 0.28s ease, stroke-width 0.28s ease;
}
.rv-connector-c,
.rv-connector-d {
  stroke-dasharray: 3 8 6 11;
}
@keyframes rv-flow {
  from { stroke-dashoffset: 15; }
  to   { stroke-dashoffset: 0; }
}
@keyframes rv-flow-lower {
  from { stroke-dashoffset: 28; }
  to   { stroke-dashoffset: 0; }
}
[data-hover] .rv-connector                { stroke-opacity: 0.08; stroke-width: 1.5; }
[data-hover="a"] .rv-connector-a,
[data-hover="b"] .rv-connector-b,
[data-hover="c"] .rv-connector-c,
[data-hover="d"] .rv-connector-d {
  stroke-opacity: 0.78;
  stroke-width: 2.2;
}
@media (prefers-reduced-motion: no-preference) {
  [data-hover="a"] .rv-connector-a,
  [data-hover="b"] .rv-connector-b,
  [data-hover="c"] .rv-connector-c,
  [data-hover="d"] .rv-connector-d { animation: rv-flow 1.25s linear infinite; }
  [data-hover="c"] .rv-connector-c,
  [data-hover="d"] .rv-connector-d { animation: rv-flow-lower 1.55s linear infinite; }
}

/* ── Remove focus outline on hit zones ── */
.rv-hit { outline: none; }
.rv-hit:focus { outline: none; }

/* ── Publication dots ── */
.vb-dot {
  transform-box: fill-box;
  transform-origin: center;
  transition: opacity 0.3s ease, transform 0.28s cubic-bezier(0.34,1.56,0.64,1), filter 0.2s ease;
  filter: none;
}

/* Zone colors */
.vb-dot-a  { fill: #7b9cc8; stroke: #7b9cc8; }
.vb-dot-b  { fill: #c8868e; stroke: #c8868e; }
.vb-dot-c  { fill: #82b896; stroke: #82b896; }
.vb-dot-d  { fill: #d1a760; stroke: #d1a760; }
.vb-dot-ab { fill: #a491ab; stroke: #a491ab; }
.vb-dot-ac { fill: #7cb0b0; stroke: #7cb0b0; }
.vb-dot-bd { fill: #cc9777; stroke: #cc9777; }
.vb-dot-cd { fill: #a9bb78; stroke: #a9bb78; }

/* Status variants */
.vb-dot[data-status="published"],
.vb-dot[data-status="accepted"] { fill-opacity: 0.88; stroke: #fff; stroke-width: 1.4; }
.vb-dot[data-status="in-press"] { fill-opacity: 0.65; stroke: #fff; stroke-width: 1.4; }
.vb-dot[data-status="review"],
.vb-dot[data-status="revision"] { fill-opacity: 0.22; stroke-opacity: 0.9; stroke-width: 1.8; }
.vb-dot[data-status="progress"] { fill-opacity: 0.15; stroke-opacity: 0.85; stroke-width: 1.8; stroke-dasharray: 3 3; }

/* Blob-hover states */
.vb-dot-dim    { opacity: 0.12 !important; animation: none !important; }
.vb-dot-focus  { filter: drop-shadow(0 2px 2px rgba(0,0,0,0.18)); transform: scale(1.22); }
.vb-dot-active { transform: scale(1.1); }
@keyframes vb-dot-breathe {
  0%, 100% { transform: translateY(0) scale(1.08); }
  50% { transform: translateY(-1.6px) scale(1.14); }
}
@keyframes vb-dot-float {
  0%, 100% { transform: translateY(0) scale(1.22); }
  50% { transform: translateY(-3.2px) scale(1.28); }
}
@media (prefers-reduced-motion: no-preference) {
  .vb-dot-active {
    animation: vb-dot-breathe 1.65s ease-in-out infinite;
    animation-delay: var(--vb-delay, 0s);
  }
  .vb-dot-focus {
    animation: vb-dot-float 0.92s ease-in-out infinite;
  }
}
.rv-core-link { cursor: pointer; }
.rv-core-art {
  isolation: isolate;
  transform-box: fill-box;
  transform-origin: center;
  transition: transform 0.22s ease;
}
.rv-core-title,
.rv-core-underline,
.rv-core-cta { transition: fill 0.22s ease, stroke 0.22s ease, stroke-width 0.22s ease; }
.rv-core-link:hover .rv-core-art,
.rv-core-link:focus .rv-core-art { transform: translateY(-3px); }
.rv-core-link:hover .rv-core-title,
.rv-core-link:focus .rv-core-title { fill: #274f84; }
.rv-core-link:hover .rv-core-underline,
.rv-core-link:focus .rv-core-underline { stroke: #e05a2b; stroke-width: 3; }
.rv-core-link:hover .rv-core-cta,
.rv-core-link:focus .rv-core-cta { fill: #245caa; }
.rv-core-pin {
  fill: #f0642c;
  stroke: #1f1f1f;
  stroke-width: 1.4;
  pointer-events: none;
}


/* ── Popover ── */
#vb-popover {
  position: fixed;
  background: #fff;
  border: 1px solid #262626;
  border-radius: 3px;
  padding: 15px 16px 13px;
  max-width: 288px;
  min-width: 196px;
  font-size: 13px;
  line-height: 1.5;
  pointer-events: auto;
  display: none;
  box-shadow: 7px 7px 0 rgba(55,108,186,0.08);
  z-index: 999;
  font-family: system-ui,-apple-system,'Segoe UI',sans-serif;
}
#vb-popover::before {
  content: "";
  position: absolute;
  top: -1px;
  left: -1px;
  width: 46px;
  height: 2px;
  background: #e05a2b;
}
.vb-pop-title  { font-weight: 700; font-size: 12.5px; color: #1a1a1a; line-height: 1.4; margin-bottom: 3px; }
.vb-pop-venue  { font-style: italic; color: #777; font-size: 11.5px; }
.vb-pop-connects {
  margin-top: 5px;
  color: #376cba;
  font-family: "Segoe Print", "Bradley Hand", cursive;
  font-size: 10.5px;
  line-height: 1.35;
}
.vb-pop-meta   { margin-top: 7px; display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.vb-pop-badge  { font-size: 10px; font-weight: 700; padding: 0; border-radius: 0; letter-spacing: 0.035em; text-transform: uppercase; }
.vb-pop-badge + .vb-pop-badge::before { content: "·"; margin: 0 5px 0 1px; color: #aaa; }
.vb-pop-year        { color: #777; }
.vb-pop-s-published { color: #2f7149; }
.vb-pop-s-accepted  { color: #376cba; }
.vb-pop-s-in-press  { color: #3e7779; }
.vb-pop-s-review    { color: #a15a28; }
.vb-pop-s-revision  { color: #9f4654; }
.vb-pop-s-progress  { color: #7a5b8d; }
.vb-pop-link { display: inline-block; margin-top: 8px; color: #274f84; font-size: 11.5px; font-weight: 700; text-decoration: underline; text-decoration-color: #e05a2b; text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
.vb-pop-link:hover { text-decoration: underline; }
</style>

<script>
(function () {
  var svg  = document.getElementById('rv-svg');
  var pop  = document.getElementById('vb-popover');
  if (!svg) return;

  /* ── Paper metadata ── */
  var PAPERS = {
    a1:  { title: 'Development and Validation of the PA-SDA Scale', venue: 'System', year: '2025', status: 'published', href: 'https://doi.org/10.1016/j.system.2025.103793' },
    a2:  { title: 'Reconceptualizing Self-Directed Learning in the Era of Generative AI', venue: 'IEEE Transactions on Learning Technologies', year: '2024', status: 'published', href: 'https://doi.org/10.1109/TLT.2024.3386098' },
    a3:  { title: 'Pathways to Proficiency: Mapping Personal Attributes in AI-Integrated SDL', venue: 'Language Learning & Technology', year: '', status: 'review', href: null },
    a4:  { title: 'SDL with GenAI: Insights from YouTube Creators', venue: 'TechTrends', year: '2024', status: 'published', href: 'https://doi.org/10.1007/s11528-024-00960-3' },
    a5:  { title: 'Multilingual ChatGPT Applications in Language Learning', venue: 'IJCALLT', year: '2023', status: 'published', href: 'https://doi.org/10.4018/IJCALLT.326135' },
    a6:  { title: 'A Meta-Analysis of AI-Assisted Self-Regulated Learning', venue: 'Online Learning', year: '', status: 'review', href: null },
    b1:  { title: 'What Makes Student–AI Collaborative Writing Authentic? A Q-Methodology Study', venue: 'International Journal for Educational Integrity', year: '', status: 'review', href: null },
    b2:  { title: 'Design Precedents Informing an AI Monitoring System for Writing Assessment', venue: 'Journal of Computing in Higher Education', year: '', status: 'accepted', href: null },
    b3:  { title: 'Infusing Authenticity into Service-Learning in the Age of AI', venue: 'Education + Training', year: '2026', status: 'published', href: 'https://doi.org/10.1108/ET-08-2025-0597' },
    b4:  { title: 'Prompt Literacy as AI-Mediated Feedback Literacy', venue: 'IJETHE', year: '', status: 'review', href: null },
    c1:  { title: "Analysing Nontraditional Students' ChatGPT Interaction, Engagement, Self-Efficacy and Performance", venue: 'British Journal of Educational Technology', year: '2025', status: 'published', href: 'https://doi.org/10.1111/bjet.13588' },
    c2:  { title: "Nontraditional Learners' Ownership and Agency with AI Writing Tools", venue: 'Journal of Computing in Higher Education', year: '2025', status: 'published', href: 'https://doi.org/10.1007/s12528-025-09476-y' },
    c3:  { title: 'Empowering Students from Low-Income Families to Improve Writing with ChatGPT', venue: 'Languages', year: '2023', status: 'published', href: 'https://doi.org/10.3390/languages8040238' },
    c4:  { title: 'Culturally and Linguistically Responsive Professional Development for AI Integration', venue: 'Online Learning', year: '2023', status: 'published', href: 'https://doi.org/10.24059/olj.v27i4.4003' },
    c5:  { title: 'Technology Review of Magic School AI', venue: 'Education Sciences', year: '2025', status: 'published', href: 'https://doi.org/10.3390/educsci15080963' },
    d1:  { title: 'AI-Generation Literacy', venue: 'Palgrave Encyclopedia of CALL', year: '2026', status: 'published', href: 'https://doi.org/10.1007/978-3-031-51447-0_260-1' },
    d2:  { title: 'Two Years of Innovation: Systematic Review of GenAI in Language Learning', venue: 'Computers and Education: AI', year: '2025', status: 'published', href: 'https://doi.org/10.1016/j.caeai.2025.100445' },
    d3:  { title: 'Language Educators × Generative AI: A Systematic Review', venue: 'International Journal of AI in Education', year: '2026', status: 'published', href: 'https://doi.org/10.1016/j.ijaied.2026.100010' },
    d4:  { title: 'The First Year of ChatGPT in Education: A Comprehensive Review', venue: 'Computers and Education: AI', year: '2024', status: 'published', href: 'https://doi.org/10.1016/j.caeai.2024.100266' },
    d5:  { title: 'TicApp: A Language Learning Design Case', venue: 'Springer', year: '2024', status: 'published', href: 'https://doi.org/10.1007/978-3-031-76293-2_12' },
    d6:  { title: 'Collaborative Problem Solving with Generative AI', venue: 'Computers & Education: AI', year: '2025', status: 'published', href: 'https://doi.org/10.1016/j.caeai.2025.100393' },
    d7:  { title: 'AI and Extended Reality in Language Education', venue: 'Education Sciences', year: '2025', status: 'published', href: 'https://doi.org/10.3390/educsci15081066' },
    d8:  { title: 'Dynamic Learner State Modeling via MCP', venue: 'Education Sciences', year: '2025', status: 'published', href: 'https://doi.org/10.3390/educsci15081004' },
    ab1: { title: 'Learning in the Loop: Moments, Mindsets, and Meaning with Generative AI', venue: 'Journal of Computer-Assisted Learning', connects: 'Agency + Assessment', year: '', status: 'review', href: null },
    ab2: { title: 'Choosing the Future of Learning: Assessing Preferences for Educational GPTs', venue: 'International Journal of Human-Computer Interaction', connects: 'Agency + Assessment', year: '', status: 'review', href: null },
    ac1: { title: 'Pathways to Proficiency: Global Validation of the PA-SDA Scale', venue: 'Under review', connects: 'Agency + Equity', year: '', status: 'review', href: null },
    bd1: { title: 'Tutor, Not Solver: Designing a Guardrailed AI Assistant for Learning', venue: 'IEEE TLT', connects: 'Assessment + AI Literacy', year: '', status: 'review', href: null },
    cd1: { title: 'Understanding AI-Assisted Learning Acceptance among Vocational Students: An AIDUA Model Approach', venue: 'IJIET', connects: 'Equity + AI Literacy', year: '2026', status: 'published', href: 'https://doi.org/10.18178/ijiet.2026.16.4.2557' }
  };

  var STATUS_LABELS = {
    'published': 'Published', 'accepted': 'Accepted', 'in-press': 'In Press',
    'review': 'Under Review', 'revision': 'In Revision', 'progress': 'In Progress'
  };

  /* ── Blob animation ── */
  var BLOBS = {
    a: { g: svg.querySelector('.blob-a'), cx: 248, cy: 228 },
    b: { g: svg.querySelector('.blob-b'), cx: 642, cy: 228 },
    c: { g: svg.querySelector('.blob-c'), cx: 252, cy: 437 },
    d: { g: svg.querySelector('.blob-d'), cx: 646, cy: 437 }
  };
  var scales = { a: 1.0, b: 1.0, c: 1.0, d: 1.0 };
  var rafs = {};
  var hoverZone = null;

  function easeOutBack(t) {
    var c1 = 1.5, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }
  function easeInOutQuad(t) {
    return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
  }
  function applyScale(zone) {
    var blob = BLOBS[zone];
    if (!blob || !blob.g) return;
    var s = scales[zone];
    blob.g.setAttribute('transform',
      'translate(' + blob.cx + ',' + blob.cy + ')' +
      ' scale(' + s.toFixed(5) + ')' +
      ' translate(' + (-blob.cx) + ',' + (-blob.cy) + ')'
    );
  }
  function animateTo(zone, target) {
    if (rafs[zone]) cancelAnimationFrame(rafs[zone]);
    var start = scales[zone], t0 = performance.now();
    var duration = target > 1 ? 480 : 320;
    var ease = target > 1 ? easeOutBack : easeInOutQuad;
    function step(now) {
      var t = Math.min((now - t0) / duration, 1);
      scales[zone] = start + (target - start) * ease(t);
      applyScale(zone);
      if (t < 1) rafs[zone] = requestAnimationFrame(step);
      else delete rafs[zone];
    }
    rafs[zone] = requestAnimationFrame(step);
  }

  /* ── Dot state on zone hover ── */
  function highlightDotsForZone(zone) {
    svg.querySelectorAll('.vb-dot').forEach(function (dot) {
      var dz = dot.getAttribute('data-zone');
      dot.classList.remove('vb-dot-active', 'vb-dot-dim');
      if (dz.indexOf(zone) !== -1) {
        dot.classList.add('vb-dot-active');
      } else {
        dot.classList.add('vb-dot-dim');
      }
    });
  }
  function resetDots() {
    svg.querySelectorAll('.vb-dot').forEach(function (dot) {
      dot.classList.remove('vb-dot-active', 'vb-dot-dim');
    });
  }

  function activateZone(zone) {
    if (!zone || hoverZone === zone) return;
    if (hoverZone) animateTo(hoverZone, 1.0);
    hoverZone = zone;
    svg.setAttribute('data-hover', zone);
    animateTo(zone, 1.028);
    highlightDotsForZone(zone);
  }

  function clearZone(zone) {
    if (!hoverZone || (zone && hoverZone !== zone)) return;
    var previous = hoverZone;
    hoverZone = null;
    svg.removeAttribute('data-hover');
    animateTo(previous, 1.0);
    resetDots();
  }

  /* ── Hit zone events ── */
  svg.querySelectorAll('.rv-hit').forEach(function (el) {
    el.addEventListener('mouseover', function () {
      activateZone(el.getAttribute('data-zone'));
    });
    el.addEventListener('mouseout', function () {
      clearZone(el.getAttribute('data-zone'));
    });
    el.addEventListener('focus', function () {
      activateZone(el.getAttribute('data-zone'));
    });
    el.addEventListener('blur', function () {
      clearZone(el.getAttribute('data-zone'));
    });
    el.addEventListener('click', function () {
      var target = el.getAttribute('data-target');
      if (target) window.location.href = target;
    });
    el.addEventListener('keydown', function (evt) {
      if (evt.key !== 'Enter' && evt.key !== ' ') return;
      evt.preventDefault();
      var target = el.getAttribute('data-target');
      if (target) window.location.href = target;
    });
  });

  /* ── Dot proximity hover via SVG mousemove ── */
  var dotData = [];
  svg.querySelectorAll('.vb-dot').forEach(function (dot, index) {
    dot.style.setProperty('--vb-delay', (-0.12 * (index % 5)) + 's');
    dotData.push({
      el: dot,
      cx: parseFloat(dot.getAttribute('cx')),
      cy: parseFloat(dot.getAttribute('cy')),
      r:  parseFloat(dot.getAttribute('r'))
    });
  });

  var currentFocusDot = null;
  var popDot = null;      // dot whose popover is currently shown
  var popTimer = null;    // hide-delay timer

  function svgPoint(e) {
    var pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }

  function buildPopover(paper) {
    var statusCls = 'vb-pop-s-' + paper.status;
    var statusLabel = STATUS_LABELS[paper.status] || paper.status;
    var html = '<div class="vb-pop-title">' + paper.title + '</div>';
    if (paper.venue) html += '<div class="vb-pop-venue">' + paper.venue + '</div>';
    if (paper.connects) html += '<div class="vb-pop-connects">Connects · ' + paper.connects + '</div>';
    html += '<div class="vb-pop-meta">';
    if (paper.year) html += '<span class="vb-pop-badge vb-pop-year">' + paper.year + '</span>';
    html += '<span class="vb-pop-badge ' + statusCls + '">' + statusLabel + '</span>';
    html += '</div>';
    if (paper.href) {
      var isExternal = paper.href.indexOf('http') === 0;
      var isPublished = paper.status === 'published' || paper.status === 'accepted' || paper.status === 'in-press';
      var label = isPublished ? '→ Read paper' : '→ Learn more';
      var tgt = isExternal ? ' target="_blank" rel="noopener"' : '';
      html += '<a class="vb-pop-link" href="' + paper.href + '"' + tgt + '>' + label + '</a>';
    }
    return html;
  }

  function showPopoverForDot(dot, e) {
    clearTimeout(popTimer);
    var paper = PAPERS[dot.getAttribute('data-paper-id')];
    if (!paper) return;
    pop.innerHTML = buildPopover(paper);
    pop.style.display = 'block';
    // Position once per dot — stays fixed so user can click the link
    var w = 272, h = 130;
    var x = e.clientX + 18, y = e.clientY - 10;
    if (x + w > window.innerWidth  - 10) x = e.clientX - w - 14;
    if (y + h > window.innerHeight - 10) y = e.clientY - h - 14;
    pop.style.left = x + 'px';
    pop.style.top  = y + 'px';
  }

  function scheduleHide() {
    clearTimeout(popTimer);
    popTimer = setTimeout(function () {
      pop.style.display = 'none';
      if (currentFocusDot) { currentFocusDot.classList.remove('vb-dot-focus'); currentFocusDot = null; }
      popDot = null;
    }, 200);
  }

  svg.addEventListener('mousemove', function (e) {
    var zoneTarget = e.target && e.target.closest ? e.target.closest('.rv-hit') : null;
    if (zoneTarget) activateZone(zoneTarget.getAttribute('data-zone'));
    else clearZone();

    var pt = svgPoint(e);
    var closestDot = null, closestDist = Infinity;
    for (var i = 0; i < dotData.length; i++) {
      var d = dotData[i];
      var dx = pt.x - d.cx, dy = pt.y - d.cy;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist <= d.r + 5 && dist < closestDist) {
        closestDist = dist;
        closestDot = d.el;
      }
    }

    // Update focus highlight
    if (closestDot !== currentFocusDot) {
      if (currentFocusDot) currentFocusDot.classList.remove('vb-dot-focus');
      currentFocusDot = closestDot;
      if (currentFocusDot) currentFocusDot.classList.add('vb-dot-focus');
    }

    // Show/update popover only when the active dot changes
    if (closestDot !== popDot) {
      popDot = closestDot;
      if (closestDot) {
        showPopoverForDot(closestDot, e);
      } else {
        scheduleHide();
      }
    }
  });

  svg.addEventListener('mouseleave', function () {
    if (currentFocusDot) { currentFocusDot.classList.remove('vb-dot-focus'); currentFocusDot = null; }
    clearZone();
    scheduleHide();
  });

  document.addEventListener('mousemove', function (e) {
    if (e.target && !svg.contains(e.target)) clearZone();
  });

  // Keep popover alive when mouse moves onto it (to click the link)
  if (pop) {
    pop.addEventListener('mouseenter', function () { clearTimeout(popTimer); });
    pop.addEventListener('mouseleave', function () { popDot = null; scheduleHide(); });
  }

  /* ── Dots visible immediately ── */
  svg.querySelectorAll('.vb-dot').forEach(function (dot) {
    dot.classList.remove('vb-dot-enter');
  });

  /* ── bfcache cleanup: restore clean state on browser back/forward ── */
  window.addEventListener('pageshow', function (e) {
    if (!e.persisted) return;
    clearTimeout(popTimer);
    if (pop) pop.style.display = 'none';
    popDot = null;
    if (currentFocusDot) { currentFocusDot.classList.remove('vb-dot-focus'); currentFocusDot = null; }
    svg.removeAttribute('data-hover');
    resetDots();
    hoverZone = null;
    ['a', 'b', 'c', 'd'].forEach(function (z) { scales[z] = 1.0; applyScale(z); });
  });

  window.addEventListener('pagehide', function () {
    clearTimeout(popTimer);
    if (pop) pop.style.display = 'none';
    // Don't touch SVG state here — CSS transitions would fire during navigation (causing the flash).
    // bfcache restore is handled by pageshow above.
  });

}());
</script>
