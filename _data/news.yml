- id: cscw-2026-family-ai-workshop
  date: "Oct 2026"
  type: talk
  text: "Joined <strong>CSCW 2026</strong>'s <em>Growing Up (and Old) with AI</em> workshop in Salt Lake City on <strong>October 11, 2026</strong> and shared our accepted paper, <em>Beyond Individual AI Literacy: Family AI Literacy as Cooperative Accomplishment</em>, co-authored with <strong>Mohan Yang</strong>. The work frames family AI literacy through joint interpretation, shared governance, and coordinated action."
  image: /assets/images/news/cscw-2026-family-ai/workshop-presentation.jpg
  image_alt: "CSCW 2026 family-centered AI workshop presentation, with a slide on Beyond Individual AI Literacy"
  image_secondary: /assets/images/news/cscw-2026-family-ai/workshop-group.jpg
  image_secondary_alt: "Participants posing together at the CSCW 2026 Growing Up (and Old) with AI workshop"
  cta_url: https://extendedhorizon.com/cscw2026ws-family-ai/files/accepted-papers/01-beyond-individual-ai-literacy.pdf
  cta_label: "Read accepted paper"

- id: edweek-english-learners-2026
  date: "Oct 2026"
  type: talk
  text: "Spoke as a panelist at <strong>Education Week</strong>'s K-12 Essentials Forum, <em>Rethinking Instruction for English Learners</em>, on <strong>October 1, 2026</strong>. Our session, <em>Lost in AI Translation: Navigating Equity, Accuracy, and Privacy</em>, explored AI translation for school-family communication. More than <strong>400 people</strong> attended the virtual forum."
